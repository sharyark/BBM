# Render Blueprint for the client-testing backend (free plan, Frankfurt: close to the Supabase DB in eu-west-1).
# Render dashboard -> New -> Blueprint -> pick this repo and branch. Values marked `sync: false` are asked for
# in the dashboard and never stored in git.
services:
  - type: web
    name: hisaab-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod
      - key: PORT
        value: "8000"
      # Free instances have 512 MB RAM; one worker keeps WeasyPrint (PDFs) inside that.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BUSINESS_NAME
        sync: false
